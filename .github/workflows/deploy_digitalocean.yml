name: Build, Push and Deploy to DigitalOcean

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Docker Compose CLI
        run: |
          DOCKER_COMPOSE_VERSION=2.20.2
          curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o $HOME/docker-compose
          chmod +x $HOME/docker-compose
          ln -sf $HOME/docker-compose $HOME/docker-compose-cli
          export PATH=$HOME:$PATH

      - name: Build base image
        run: |
          docker build -t adrianachaves/chatwoot:development -f docker/Dockerfile .

      - name: Build base image
        run: |
          docker build -t adrianachaves/chatwoot:development -f docker/Dockerfile .

      - name: Build base image
        run: |
          docker build -t adrianachaves/chatwoot:development -f docker/Dockerfile .

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.yaml build
          # Push each image explicitly
          docker push adrianachaves/chatwoot:development
          docker push adrianachaves/chatwoot-rails:development
          docker push adrianachaves/chatwoot-vite:development

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.182.162.32
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/root/chatwoot
            docker compose pull
            docker compose up -d